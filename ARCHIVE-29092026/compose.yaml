services:
  pgvector:

    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chunknorris
      POSTGRES_USER: chunknorris
      POSTGRES_PASSWORD: chunknorris
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
