spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/chunknorris
    username: chunknorris
    password: chunknorris

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

rag:
  chunk-size: 300
  chunk-overlap: 50
  top-k: 4
  similarity-threshold: 0.5
  memory-window: 10
  max-upload-bytes: 20971520
  upload-dir: data/uploads
