spring:

  application:
    name: chunk-norris

  datasource:
    url: jdbc:postgresql://localhost:5432/chunknorris
    username: chunknorris
    password: chunknorris

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          num-ctx: 8192
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text-v2-moe
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  docker:
    compose:
      lifecycle-management: none

springdoc:

  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    enabled: true

scalar:
  enabled: true
  path: /scalar

rag:
  chunk-size: 300
  top-k: 4
  similarity-threshold: 0.5
  upload-dir: data/uploads