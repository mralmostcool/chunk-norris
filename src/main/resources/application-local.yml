spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/chunknorris
    username: chunknorris
    password: chunknorris

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          num-ctx: 8192
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text-v2-moe
    vectorstore:
      pgvector:
        table-name: vector_store
        initialize-schema: false
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW

rag:
  chunk-size: 300
  chunk-overlap: 50
  top-k: 4
  similarity-threshold: 0.5
  memory-window: 10
  max-upload-bytes: 20971520
  upload-dir: data/uploads
