spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/chunknorris
    username: chunknorris
    password: chunknorris

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5:7b
          num-ctx: 8192
          temperature: 0.2
      embedding:
        options:
          model: nomic-embed-text-v2-moe
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW

rag:
  chunk-size: 300
  chunk-overlap: 50
  top-k: 4
  similarity-threshold: 0.5
  memory-window: 10
  max-upload-bytes: 20971520
  upload-dir: data/uploads
